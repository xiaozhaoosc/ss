<!DOCTYPE html>
<html class="light" lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Small Steps - 任务完成</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes pop {
            0% {
                transform: scale(0);
                opacity: 0;
            }

            60% {
                transform: scale(1.2);
                opacity: 1;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes confetti-fall {
            0% {
                transform: translateY(-100vh) rotate(0deg);
            }

            100% {
                transform: translateY(100vh) rotate(360deg);
            }
        }

        @keyframes float {
            0% {
                transform: translateY(0px) rotate(0deg);
            }

            50% {
                transform: translateY(-20px) rotate(5deg);
            }

            100% {
                transform: translateY(0px) rotate(0deg);
            }
        }

        @keyframes rays {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .pop-in {
            animation: pop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .spin-rays {
            animation: rays 10s linear infinite;
        }

        .float-star {
            animation: float 3s ease-in-out infinite;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            opacity: 0.8;
            animation: confetti-fall 3s linear infinite;
        }
    </style>
</head>

<body class="bg-indigo-900 h-screen w-full overflow-hidden flex flex-col items-center justify-center relative">

    <!-- Confetti Background (Simulated with simple divs) -->
    <div class="absolute inset-0 z-0 opacity-50 pointer-events-none">
        <div class="confetti bg-red-400 left-[10%] animation-delay-0"></div>
        <div class="confetti bg-yellow-400 left-[20%] animation-delay-200" style="animation-delay: 0.5s;"></div>
        <div class="confetti bg-green-400 left-[30%] animation-delay-500" style="animation-delay: 1s;"></div>
        <div class="confetti bg-blue-400 left-[50%] animation-delay-100" style="animation-delay: 0.2s;"></div>
        <div class="confetti bg-pink-400 left-[70%] animation-delay-300" style="animation-delay: 0.8s;"></div>
        <div class="confetti bg-purple-400 left-[85%] animation-delay-600" style="animation-delay: 1.2s;"></div>
        <div class="confetti bg-orange-400 left-[95%] animation-delay-400" style="animation-delay: 0.4s;"></div>
    </div>

    <!-- Radiant Background -->
    <div class="absolute inset-0 flex items-center justify-center pointer-events-none z-0 opacity-30">
        <div
            class="w-[800px] h-[800px] bg-gradient-to-r from-yellow-300/20 to-orange-400/20 rounded-full blur-3xl spin-rays">
        </div>
    </div>

    <!-- Central Content -->
    <div class="relative z-10 flex flex-col items-center text-center px-6 w-full max-w-md">

        <!-- Animated Main Star -->
        <div class="relative mb-8 pop-in">
            <!-- Back Glow -->
            <div
                class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-40 h-40 bg-yellow-400 rounded-full blur-xl opacity-60 animate-pulse">
            </div>
            <!-- Star Icon -->
            <div
                class="relative z-10 text-yellow-300 transform scale-150 float-star filter drop-shadow-[0_0_15px_rgba(253,224,71,0.8)]">
                <span class="material-symbols-outlined text-[150px]"
                    style="font-variation-settings: 'FILL' 1;">star</span>
            </div>
            <!-- Coins/Stars particles (Static CSS representation) -->
            <div class="absolute -top-4 -right-4 text-yellow-200 text-4xl animate-bounce"
                style="animation-delay: 0.2s;">✦</div>
            <div class="absolute bottom-0 -left-6 text-yellow-200 text-3xl animate-bounce"
                style="animation-delay: 0.5s;">✦</div>
        </div>

        <!-- Text Feedback -->
        <h1 class="text-4xl font-black text-white mb-2 tracking-wide pop-in" style="animation-delay: 0.3s;">任务完成!</h1>
        <p class="text-indigo-200 text-lg font-bold mb-10 pop-in" style="animation-delay: 0.5s;">你真是个专注小天才!</p>

        <!-- Big CTA Button -->
        <a href="./child_home.html" class="w-full pop-in" style="animation-delay: 0.8s; text-decoration: none;">
            <button
                class="w-full bg-yellow-400 hover:bg-yellow-300 text-yellow-900 text-2xl font-black py-4 rounded-full shadow-[0_8px_0_#b45309] active:shadow-none active:translate-y-[8px] transition-all transform hover:scale-105 flex items-center justify-center gap-2">
                <span class="material-symbols-outlined text-3xl"
                    style="font-variation-settings: 'FILL' 1;">download</span>
                收取星星 (+5)
            </button>
        </a>

        <!-- "Play Again" subtle link (optional) -->
        <a href="./child_task_execute.html"
            class="mt-6 text-white/50 font-bold text-sm hover:text-white transition-colors pop-in"
            style="animation-delay: 1.2s; text-decoration: none;">
            再做一个任务?
        </a>

    </div>

</body>

</html>
