<!DOCTYPE html>

<html class="light" lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Child Task Execute (CN)</title>
    <!-- Material Symbols -->
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Theme Configuration -->
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec54",
                        "primary-dark": "#0fb840",
                        "accent": "#8CD0A1",
                        "background-light": "#f6f8f6", // Kept from config
                        "background-soft": "#F0F9FF", // User requested specific bg
                        "background-dark": "#102216",
                        "text-main": "#0d1b12",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "Noto Sans SC", "sans-serif"],
                        "body": ["Noto Sans SC", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" },
                    boxShadow: {
                        'bouncy': '0 10px 25px -5px rgba(19, 236, 84, 0.4), 0 8px 10px -6px rgba(19, 236, 84, 0.2)',
                        'inner-soft': 'inset 0 2px 4px 0 rgba(0, 0, 0, 0.06)',
                    }
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 600, 'GRAD' 0, 'opsz' 24;
        }

        /* Custom Bouncy Button Animation */
        .btn-bounce {
            transition: transform 0.1s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .btn-bounce:active {
            transform: scale(0.95);
        }

        /* SVG Circle Animation */
        .progress-ring__circle {
            transition: stroke-dashoffset 0.35s;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body class="bg-background-soft dark:bg-background-dark font-display text-text-main transition-colors duration-200">
    <div
        class="relative flex h-full min-h-screen w-full flex-col overflow-hidden max-w-md mx-auto shadow-2xl bg-background-soft dark:bg-background-dark">
        <!-- Header -->
        <header class="flex items-center p-6 pt-8 pb-2 justify-between z-10">
            <button aria-label="Go back"
                class="flex size-12 shrink-0 items-center justify-center rounded-full bg-white/50 dark:bg-white/10 hover:bg-white/80 transition-colors text-slate-700 dark:text-white">
                <span class="material-symbols-outlined text-[28px]">arrow_back</span>
            </button>
            <h2
                class="text-slate-800 dark:text-white text-lg font-bold leading-tight tracking-tight flex-1 text-center pr-12">
                专注时刻</h2>
        </header>
        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col items-center w-full px-6 relative z-10">
            <!-- Progress Indicator -->
            <div
                class="mt-4 mb-2 flex items-center justify-center gap-2 py-2 px-4 rounded-full bg-accent/20 border border-accent/30 text-emerald-800 dark:text-emerald-100">
                <span class="material-symbols-outlined text-[20px] text-emerald-600 dark:text-emerald-400">flag</span>
                <p class="text-sm font-bold tracking-wide">第 1/3 步</p>
            </div>
            <!-- Headline -->
            <h1
                class="text-slate-800 dark:text-white text-[36px] font-extrabold leading-tight text-center py-4 tracking-tight drop-shadow-sm">
                正在阅读...
            </h1>
            <!-- Focus Tunnel Timer -->
            <div class="flex-1 flex items-center justify-center w-full py-8">
                <div class="relative flex items-center justify-center size-[280px]">
                    <!-- Decorative background glow -->
                    <div
                        class="absolute inset-0 bg-primary/20 dark:bg-primary/10 rounded-full blur-3xl transform scale-90">
                    </div>
                    <!-- Outer Decorative Ring -->
                    <div class="absolute inset-0 rounded-full border-[24px] border-white dark:border-white/5 shadow-xl">
                    </div>
                    <!-- SVG Progress Ring -->
                    <svg class="size-[280px] transform -rotate-90 drop-shadow-lg" viewbox="0 0 120 120">
                        <!-- Background Circle -->
                        <circle class="text-gray-200 dark:text-gray-700" cx="60" cy="60" fill="transparent" r="52"
                            stroke="currentColor" stroke-width="8"></circle>
                        <!-- Progress Circle -->
                        <circle class="text-primary progress-ring__circle" cx="60" cy="60" fill="transparent" r="52"
                            stroke="currentColor" stroke-dasharray="326.72" stroke-dashoffset="81"
                            stroke-linecap="round" stroke-width="8"></circle>
                    </svg>
                    <!-- Center Timer Content -->
                    <div class="absolute inset-0 flex flex-col items-center justify-center">
                        <span
                            class="text-6xl font-black text-slate-800 dark:text-white tracking-tighter tabular-nums">15:00</span>
                        <span
                            class="text-slate-400 dark:text-slate-500 text-sm font-bold uppercase tracking-widest mt-1">剩余时间</span>
                    </div>
                </div>
            </div>
            <!-- Gamification Elements / Decorations -->
            <div class="w-full flex justify-center pb-6 opacity-60">
                <div class="flex gap-1">
                    <div class="w-2 h-2 rounded-full bg-accent animate-pulse"></div>
                    <div class="w-2 h-2 rounded-full bg-accent animate-pulse delay-75"></div>
                    <div class="w-2 h-2 rounded-full bg-accent animate-pulse delay-150"></div>
                </div>
            </div>
        </main>
        <!-- Footer Action Button -->
        <footer class="w-full px-6 pb-10 pt-2 z-20">
            <button
                class="btn-bounce group w-full relative flex items-center justify-center overflow-hidden rounded-full h-20 bg-primary hover:bg-primary-dark text-text-main shadow-bouncy transition-colors duration-300">
                <!-- Inner light reflection for plastic toy look -->
                <div
                    class="absolute top-0 left-0 w-full h-1/2 bg-gradient-to-b from-white/30 to-transparent pointer-events-none">
                </div>
                <div class="flex items-center gap-3 relative z-10">
                    <span class="text-2xl font-black tracking-wide text-[#0d1b12]">我完成了！</span>
                    <span class="material-symbols-outlined text-3xl text-[#0d1b12]">check_circle</span>
                </div>
            </button>
            <p class="text-center text-slate-400 dark:text-slate-600 text-xs mt-4 font-medium">点击上方按钮完成当前任务</p>
        </footer>
        <!-- Background Decorations (Bubbles) -->
        <div class="absolute top-20 left-[-20px] w-24 h-24 bg-accent/10 rounded-full blur-2xl pointer-events-none z-0">
        </div>
        <div
            class="absolute bottom-40 right-[-10px] w-32 h-32 bg-primary/10 rounded-full blur-3xl pointer-events-none z-0">
        </div>
    </div>

    <!-- Gamified Nav added by Antigravity -->
    <nav
        style="position: fixed; bottom: 0; width: 100%; background: #F0F9FF; border-top: 2px solid #8CD0A1; display: flex; justify-content: space-around; padding: 15px 0; border-radius: 20px 20px 0 0; box-shadow: 0 -4px 10px rgba(0,0,0,0.05); z-index: 50;">
        <a href="./child_home.html"
            style="text-decoration: none; color: #111827; background: #FFF; border: 2px solid #FFD54F; padding: 6px 14px; border-radius: 20px;">🏠
            主页</a>
        <a href="./child_task_execute.html"
            style="text-decoration: none; color: #111827; font-weight: bold; background: #FFD54F; padding: 8px 16px; border-radius: 20px; box-shadow: 0 4px 0 #E0A800;">🎯
            任务</a>
        <a href="./child_reward_shop.html"
            style="text-decoration: none; color: #111827; background: #FFF; border: 2px solid #FFD54F; padding: 6px 14px; border-radius: 20px;">🎁
            商店</a>
        <a href="./child_avatar_editor.html"
            style="text-decoration: none; color: #111827; background: #FFF; border: 2px solid #FFD54F; padding: 6px 14px; border-radius: 20px;">🤖
            换装</a>
    </nav>
</body>

</html>
