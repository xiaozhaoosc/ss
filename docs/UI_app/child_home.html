<!DOCTYPE html>

<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Small Steps - Trophy Room</title>
    <!-- Material Symbols -->
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Theme Config -->
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f48c25",
                        "primary-dark": "#d67614",
                        "accent-mint": "#8CD0A1",
                        "accent-yellow": "#F5D76E",
                        "accent-yellow-dark": "#e0c25a",
                        "background-light": "#f8f7f5",
                        "background-dark": "#221910",
                    },
                    fontFamily: {
                        "display": ["Spline Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "1.5rem",
                        "xl": "2.5rem",
                        "2xl": "3rem",
                        "full": "9999px"
                    },
                    boxShadow: {
                        'bouncy': '0 8px 0px 0px rgba(0,0,0,0.1)',
                        'bouncy-sm': '0 4px 0px 0px rgba(0,0,0,0.1)',
                        'bouncy-primary': '0 6px 0px 0px #d67614',
                        'glow': '0 0 20px rgba(244, 140, 37, 0.4)',
                    }
                },
            },
        }
    </script>
    <style>
        /* Custom styles for the map path and animations */
        .map-path {
            background-image: repeating-linear-gradient(to right, #9c7349 0, #9c7349 10px, transparent 10px, transparent 20px);
            background-position: center;
            background-size: 100% 4px;
            background-repeat: no-repeat;
        }

        /* Floating animation for elements */
        @keyframes float {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-10px);
            }

            100% {
                transform: translateY(0px);
            }
        }

        .animate-float {
            animation: float 4s ease-in-out infinite;
        }

        /* Wiggle animation */
        @keyframes wiggle {

            0%,
            100% {
                transform: rotate(-3deg);
            }

            50% {
                transform: rotate(3deg);
            }
        }

        .animate-wiggle {
            animation: wiggle 2s ease-in-out infinite;
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body class="font-display antialiased text-[#1c140d]">
    <!-- Main Container with Gradient Background -->
    <div
        class="relative flex h-full min-h-screen w-full flex-col bg-gradient-to-br from-[#8CD0A1] to-[#F5D76E] overflow-hidden">
        <!-- Decorative Background Elements (Clouds/Shapes) -->
        <div class="absolute top-10 left-[-50px] w-40 h-40 bg-white/20 rounded-full blur-2xl"></div>
        <div class="absolute bottom-40 right-[-20px] w-60 h-60 bg-white/20 rounded-full blur-3xl"></div>
        <!-- Header: Stats Bar -->
        <div class="relative z-10 flex items-center justify-between p-4 pt-6">
            <!-- Streak Counter -->
            <div
                class="flex items-center gap-2 bg-white/90 backdrop-blur-sm rounded-full p-2 pr-4 shadow-bouncy-sm border-2 border-white">
                <div class="flex items-center justify-center bg-orange-100 rounded-full size-10">
                    <span class="material-symbols-outlined text-orange-500 text-2xl"
                        style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
                </div>
                <div>
                    <p class="text-xs text-gray-500 font-bold uppercase tracking-wider leading-none mb-0.5">Streak</p>
                    <p class="text-xl font-bold leading-none text-[#1c140d]">3 Days</p>
                </div>
            </div>
            <!-- Settings Button (Hidden access for parents) -->
            <button class="bg-white/40 hover:bg-white/60 text-white rounded-full p-2 transition-colors">
                <span class="material-symbols-outlined">settings</span>
            </button>
            <!-- Star Jar -->
            <div
                class="flex items-center gap-2 bg-white/90 backdrop-blur-sm rounded-full p-2 pl-4 shadow-bouncy-sm border-2 border-white animate-wiggle">
                <div class="text-right">
                    <p class="text-xs text-gray-500 font-bold uppercase tracking-wider leading-none mb-0.5">Stars</p>
                    <p class="text-xl font-bold leading-none text-primary">54</p>
                </div>
                <div
                    class="relative flex items-center justify-center bg-yellow-100 rounded-full size-10 border-2 border-yellow-400 overflow-hidden">
                    <div class="absolute inset-x-0 bottom-0 bg-yellow-400 h-[60%] opacity-50"></div>
                    <span class="material-symbols-outlined text-yellow-600 relative z-10 text-2xl"
                        style="font-variation-settings: 'FILL' 1;">star</span>
                </div>
            </div>
        </div>
        <!-- Scrollable Content Area -->
        <div class="flex-1 flex flex-col items-center justify-start overflow-y-auto pb-24 no-scrollbar">
            <!-- Robot Avatar Area -->
            <div class="w-full flex flex-col items-center justify-center pt-4 pb-2 relative z-10">
                <!-- Speech Bubble -->
                <div
                    class="bg-white rounded-2xl rounded-bl-none p-4 mb-4 shadow-lg max-w-[280px] transform transition-transform hover:scale-105 origin-bottom-left animate-float">
                    <p class="text-lg font-bold text-center leading-tight">Ready for your next mission, Alex? 🤖</p>
                </div>
                <!-- Robot Image -->
                <div
                    class="size-40 md:size-52 bg-white/30 backdrop-blur-md rounded-full flex items-center justify-center p-2 shadow-glow border-4 border-white/50">
                    <div class="w-full h-full rounded-full bg-center bg-cover border-4 border-white shadow-inner bg-gradient-to-b from-blue-100 to-blue-200"
                        data-alt="Cute friendly robot avatar with big eyes smiling"
                        style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuAA0RmcSQACImzUoE9woyc6-iyIeWXkvAw4lxZnIr9f-HJd8UDiHGwhHva02eLf1l--Q5SMauQxBc1YriECXhMtDDCPrO4m9Ab_7FvJ0xhktITS2cOnh7snQbeQSqNH7003z1j2AZfQatNbPTCZn4SczwbadodstvQLdfrwsStdm6WYruauaA2fXZWL-lKaGVKEEFmLni1Pz7ZUP0OkMVZom1KOsZ4vhRSI6-Ph-P2B25ItChVNt_BamCyGzq0fOcy_u6ce0eEdOPQ");'>
                    </div>
                </div>
            </div>
            <!-- Current Mission Card -->
            <div class="w-full px-4 max-w-md -mt-6 relative z-20">
                <div
                    class="bg-white rounded-2xl shadow-bouncy p-1 border-4 border-white transform rotate-1 hover:rotate-0 transition-transform duration-300">
                    <div
                        class="bg-blue-50 rounded-[1.2rem] p-5 flex flex-col items-center text-center relative overflow-hidden">
                        <!-- Background Pattern inside card -->
                        <div class="absolute top-0 left-0 w-full h-full opacity-10"
                            style="background-image: radial-gradient(#4b5563 1px, transparent 1px); background-size: 20px 20px;">
                        </div>
                        <div class="relative z-10 w-full flex flex-col items-center">
                            <div class="bg-white p-3 rounded-2xl mb-4 shadow-sm border-2 border-blue-100">
                                <span class="material-symbols-outlined text-blue-500 text-5xl">dentistry</span>
                            </div>
                            <h3 class="text-2xl font-black text-[#1c140d] mb-1">Brush Your Teeth</h3>
                            <p class="text-gray-500 font-medium mb-6">Make them sparkle! ✨</p>
                            <!-- Reward Badge -->
                            <div
                                class="bg-yellow-100 text-yellow-800 px-4 py-1.5 rounded-full font-bold text-sm mb-6 flex items-center gap-1 border border-yellow-200">
                                <span class="material-symbols-outlined text-lg"
                                    style="font-variation-settings: 'FILL' 1;">star</span>
                                +5 Stars Reward
                            </div>
                            <!-- Big Action Button -->
                            <button
                                class="w-full bg-primary hover:bg-primary-dark text-white text-xl font-bold py-4 px-6 rounded-2xl shadow-bouncy-primary active:shadow-none active:translate-y-[6px] transition-all flex items-center justify-center gap-2 group">
                                <span>I Did It!</span>
                                <span class="material-symbols-outlined group-hover:animate-bounce">check_circle</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Secondary Actions / Quick Links -->
            <div class="w-full px-6 mt-8 grid grid-cols-2 gap-4 max-w-md">
                <div
                    class="bg-white/80 backdrop-blur-sm p-4 rounded-xl shadow-sm border-2 border-white/50 flex flex-col items-center gap-2 cursor-pointer hover:bg-white transition-colors">
                    <div class="bg-purple-100 p-2 rounded-full text-purple-600">
                        <span class="material-symbols-outlined">palette</span>
                    </div>
                    <span class="font-bold text-sm text-gray-700">Art Class</span>
                </div>
                <div
                    class="bg-white/80 backdrop-blur-sm p-4 rounded-xl shadow-sm border-2 border-white/50 flex flex-col items-center gap-2 cursor-pointer hover:bg-white transition-colors">
                    <div class="bg-green-100 p-2 rounded-full text-green-600">
                        <span class="material-symbols-outlined">sports_soccer</span>
                    </div>
                    <span class="font-bold text-sm text-gray-700">Play Time</span>
                </div>
            </div>
        </div>
        <!-- Bottom Navigation: The Map Path -->
        <div class="absolute bottom-0 w-full h-24 z-30">
            <!-- Glass Background for Nav -->
            <div
                class="absolute inset-0 bg-white/60 backdrop-blur-lg border-t border-white/50 rounded-t-[2.5rem] shadow-[0_-10px_40px_rgba(0,0,0,0.05)]">
            </div>
            <div class="relative z-10 w-full h-full flex items-center justify-center max-w-md mx-auto px-6">
                <!-- The Dashed Path Line -->
                <div
                    class="absolute w-[70%] h-1 bg-gray-300 rounded-full top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 border-b-4 border-dashed border-gray-400 opacity-30">
                </div>
                <!-- Nav Items as Map Nodes -->
                <div class="w-full flex justify-between items-center relative">
                    <!-- Node 1: Shop (Locked) -->
                    <button class="flex flex-col items-center gap-1 group opacity-60 scale-90">
                        <div
                            class="size-12 rounded-full bg-gray-200 border-4 border-gray-300 flex items-center justify-center shadow-sm relative">
                            <span class="material-symbols-outlined text-gray-400">storefront</span>
                            <div class="absolute -top-1 -right-1 bg-gray-400 rounded-full p-0.5 border-2 border-white">
                                <span class="material-symbols-outlined text-white text-[10px]">lock</span>
                            </div>
                        </div>
                        <span class="text-xs font-bold text-gray-500">Shop</span>
                    </button>
                    <!-- Node 2: Trophy Room (Active/Current) -->
                    <button class="flex flex-col items-center gap-1 -mt-8 transform scale-110">
                        <div
                            class="size-16 rounded-full bg-primary border-[6px] border-white flex items-center justify-center shadow-lg relative z-10 ring-4 ring-primary/20">
                            <span class="material-symbols-outlined text-white text-3xl"
                                style="font-variation-settings: 'FILL' 1;">emoji_events</span>
                        </div>
                        <span
                            class="text-sm font-black text-primary bg-white px-2 py-0.5 rounded-full shadow-sm">Home</span>
                    </button>
                    <!-- Node 3: Adventure Map -->
                    <button class="flex flex-col items-center gap-1 group hover:scale-105 transition-transform">
                        <div
                            class="size-12 rounded-full bg-accent-mint border-4 border-white flex items-center justify-center shadow-bouncy-sm group-hover:shadow-none group-hover:translate-y-1 transition-all">
                            <span class="material-symbols-outlined text-white font-bold">map</span>
                        </div>
                        <span class="text-xs font-bold text-[#1c140d]">Map</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <!-- Haptic feedback script simulation (Just for completeness, visual feedback is handled by CSS) -->
    <script>
        // No JS logic as per request, just pure HTML/Tailwind
    </script>

    <!-- Gamified Nav added by Antigravity -->
    <nav
        style="position: fixed; bottom: 0; width: 100%; background: #F0F9FF; border-top: 2px solid #8CD0A1; display: flex; justify-content: space-around; padding: 15px 0; border-radius: 20px 20px 0 0; box-shadow: 0 -4px 10px rgba(0,0,0,0.05); z-index: 50;">
        <a href="./child_home.html"
            style="text-decoration: none; color: #111827; font-weight: bold; background: #8CD0A1; padding: 8px 16px; border-radius: 20px; box-shadow: 0 4px 0 #68A67B;">🏠
            主页</a>
        <a href="./child_task_execute.html"
            style="text-decoration: none; color: #111827; background: #FFF; border: 2px solid #FFD54F; padding: 6px 14px; border-radius: 20px;">🎯
            任务</a>
        <a href="./child_reward_shop.html"
            style="text-decoration: none; color: #111827; background: #FFF; border: 2px solid #FFD54F; padding: 6px 14px; border-radius: 20px;">🎁
            商店</a>
        <a href="./child_avatar_editor.html"
            style="text-decoration: none; color: #111827; background: #FFF; border: 2px solid #FFD54F; padding: 6px 14px; border-radius: 20px;">🤖
            换装</a>
    </nav>
</body>

</html>
