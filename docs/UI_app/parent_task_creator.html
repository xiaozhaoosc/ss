<!DOCTYPE html>

<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Parent Task Creator (CN)</title>
    <!-- Material Symbols -->
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Theme Configuration -->
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#6C9BD2", // User requested Soft Blue
                        "primary-dark": "#5a82b0",
                        "background-light": "#f8f9fa",
                        "background-dark": "#14191e",
                        "surface-light": "#ffffff",
                        "surface-dark": "#1e242b",
                        "text-main": "#101419",
                        "text-secondary": "#5b718b",
                    },
                    fontFamily: {
                        "display": ["Inter", "Noto Sans SC", "sans-serif"],
                        "body": ["Inter", "Noto Sans SC", "sans-serif"],
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "md": "0.375rem",
                        "lg": "0.5rem", // 8px as requested
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "full": "9999px"
                    },
                    boxShadow: {
                        'soft': '0 2px 8px -2px rgba(0, 0, 0, 0.05)',
                        'card': '0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06)',
                    }
                },
            },
        }
    </script>
    <style>
        /* Custom scrollbar hide for cleaner UI */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body
    class="bg-background-light dark:bg-background-dark font-display text-text-main antialiased selection:bg-primary/30">
    <div
        class="relative flex h-screen w-full flex-col overflow-hidden max-w-md mx-auto bg-background-light dark:bg-background-dark shadow-2xl">
        <!-- Header -->
        <header
            class="flex items-center justify-between px-4 py-3 bg-background-light dark:bg-background-dark z-20 shrink-0">
            <!-- Left placeholder for balance or back button if needed -->
            <div class="w-16">
                <button
                    class="flex items-center justify-center size-10 rounded-full text-text-main hover:bg-gray-100 dark:hover:bg-surface-dark transition-colors">
                    <span class="material-symbols-outlined text-[24px]">arrow_back</span>
                </button>
            </div>
            <h1 class="text-lg font-bold text-text-main dark:text-white flex-1 text-center truncate">创建任务</h1>
            <div class="w-16 flex justify-end">
                <button class="flex items-center bg-gray-200 dark:bg-surface-dark rounded-full px-1 py-1 h-8">
                    <span class="text-xs font-bold text-white bg-primary rounded-full px-2 py-0.5 shadow-sm">CN</span>
                    <span class="text-xs font-medium text-text-secondary px-2">EN</span>
                </button>
            </div>
        </header>
        <!-- Main Scrollable Content -->
        <main class="flex-1 overflow-y-auto no-scrollbar pb-24 px-4 pt-2">
            <!-- Input Section -->
            <div class="flex flex-col gap-3 mb-6">
                <div class="relative w-full group">
                    <textarea
                        class="w-full min-h-[140px] resize-none rounded-lg bg-surface-light dark:bg-surface-dark border-0 ring-1 ring-gray-200 dark:ring-gray-700 focus:ring-2 focus:ring-primary/50 text-base p-4 placeholder:text-text-secondary/70 shadow-sm transition-all"
                        placeholder="输入你想让孩子做的事...
例如：收拾书包准备去学校"></textarea>
                    <div class="absolute bottom-3 right-3 text-xs text-text-secondary dark:text-gray-500 font-medium">
                        0/200
                    </div>
                </div>
                <!-- AI Breakdown Button -->
                <button
                    class="flex w-full items-center justify-center gap-2 rounded-lg bg-primary/10 hover:bg-primary/20 active:bg-primary/30 h-12 text-primary font-bold transition-colors group">
                    <span
                        class="material-symbols-outlined text-[20px] group-hover:scale-110 transition-transform">spark</span>
                    <span>AI 拆解</span>
                </button>
            </div>
            <!-- Task Steps Section -->
            <div class="flex flex-col gap-3">
                <div class="flex items-center justify-between py-2">
                    <h3 class="text-base font-bold text-text-main dark:text-white">任务步骤</h3>
                    <span
                        class="text-xs font-medium text-text-secondary bg-gray-100 dark:bg-surface-dark px-2 py-1 rounded-md">3
                        步</span>
                </div>
                <!-- Task List Container -->
                <div class="flex flex-col gap-3" id="task-list">
                    <!-- Task Item 1 -->
                    <div
                        class="group relative flex items-center gap-3 bg-surface-light dark:bg-surface-dark p-3 rounded-lg border border-transparent shadow-soft hover:shadow-card hover:border-primary/20 transition-all cursor-move">
                        <div
                            class="text-text-secondary/50 group-hover:text-primary cursor-grab active:cursor-grabbing flex items-center justify-center">
                            <span class="material-symbols-outlined text-[24px]">drag_indicator</span>
                        </div>
                        <div class="flex-1 min-w-0">
                            <p class="text-sm font-semibold text-text-main dark:text-white truncate">穿好袜子</p>
                            <p class="text-xs text-text-secondary truncate mt-0.5">找到一双干净的袜子并穿上</p>
                        </div>
                        <button
                            class="size-8 flex items-center justify-center rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 text-text-secondary transition-colors">
                            <span class="material-symbols-outlined text-[20px]">edit</span>
                        </button>
                    </div>
                    <!-- Task Item 2 -->
                    <div
                        class="group relative flex items-center gap-3 bg-surface-light dark:bg-surface-dark p-3 rounded-lg border border-transparent shadow-soft hover:shadow-card hover:border-primary/20 transition-all cursor-move">
                        <div
                            class="text-text-secondary/50 group-hover:text-primary cursor-grab active:cursor-grabbing flex items-center justify-center">
                            <span class="material-symbols-outlined text-[24px]">drag_indicator</span>
                        </div>
                        <div class="flex-1 min-w-0">
                            <p class="text-sm font-semibold text-text-main dark:text-white truncate">穿好鞋子</p>
                            <p class="text-xs text-text-secondary truncate mt-0.5">区分左右脚，系好鞋带</p>
                        </div>
                        <button
                            class="size-8 flex items-center justify-center rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 text-text-secondary transition-colors">
                            <span class="material-symbols-outlined text-[20px]">edit</span>
                        </button>
                    </div>
                    <!-- Task Item 3 -->
                    <div
                        class="group relative flex items-center gap-3 bg-surface-light dark:bg-surface-dark p-3 rounded-lg border border-transparent shadow-soft hover:shadow-card hover:border-primary/20 transition-all cursor-move">
                        <div
                            class="text-text-secondary/50 group-hover:text-primary cursor-grab active:cursor-grabbing flex items-center justify-center">
                            <span class="material-symbols-outlined text-[24px]">drag_indicator</span>
                        </div>
                        <div class="flex-1 min-w-0">
                            <p class="text-sm font-semibold text-text-main dark:text-white truncate">拿上书包</p>
                            <p class="text-xs text-text-secondary truncate mt-0.5">确认作业都在书包里</p>
                        </div>
                        <button
                            class="size-8 flex items-center justify-center rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 text-text-secondary transition-colors">
                            <span class="material-symbols-outlined text-[20px]">edit</span>
                        </button>
                    </div>
                    <!-- Add New Step Placeholder -->
                    <button
                        class="flex items-center justify-center gap-2 p-3 border-2 border-dashed border-gray-200 dark:border-gray-700 rounded-lg text-text-secondary hover:border-primary/50 hover:text-primary transition-all group">
                        <span class="material-symbols-outlined text-[20px]">add_circle</span>
                        <span class="text-sm font-medium">添加步骤</span>
                    </button>
                </div>
            </div>
            <!-- Visual Spacer for scroll content vs fixed footer -->
            <div class="h-8"></div>
        </main>
        <!-- Fixed Footer -->
        <footer
            class="absolute bottom-0 left-0 w-full bg-surface-light/90 dark:bg-surface-dark/90 backdrop-blur-md border-t border-gray-100 dark:border-gray-800 p-4 z-30">
            <!-- Advanced Options -->
            <div class="flex items-center justify-between mb-3 px-1">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" class="rounded text-primary border-gray-300 focus:ring-primary/50">
                    <span class="text-xs text-text-secondary dark:text-gray-400">每天重复</span>
                </label>
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" class="rounded text-primary border-gray-300 focus:ring-primary/50">
                    <span class="text-xs text-text-secondary dark:text-gray-400">存为模板</span>
                </label>
            </div>
            <button
                class="w-full flex items-center justify-center gap-2 bg-primary hover:bg-primary-dark text-white font-bold h-12 rounded-lg shadow-lg shadow-primary/30 active:scale-[0.98] transition-all">
                <span>发送给 StarBuddy</span>
                <span class="material-symbols-outlined text-[20px]">send</span>
            </button>
        </footer>
    </div>

    <!-- Navigation Links added by Antigravity -->
    <nav
        style="position: fixed; bottom: 0; width: 100%; background: white; border-top: 1px solid #eee; display: flex; justify-content: space-around; padding: 10px 0;">
        <a href="./parent_dashboard.html" style="text-decoration: none; color: #666;">首页</a>
        <a href="./parent_task_creator.html" style="text-decoration: none; color: #6C9BD2; font-weight: bold;">任务</a>
        <a href="./parent_insights.html" style="text-decoration: none; color: #666;">洞察</a>
        <a href="./parent_profile.html" style="text-decoration: none; color: #666;">我的</a>
    </nav>
</body>

</html>
