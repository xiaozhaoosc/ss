version: '3.8'

# 项目名称 (在 .env 中定义 PROJECT_NAME=small-steps)
name: ${PROJECT_NAME}

# =================================================================
# 🇨🇳 中国大陆网络特别说明
# -----------------------------------------------------------------
# 为了解决 Docker Hub 拉取慢的问题，所有 image 指令都使用了 
# ${DOCKER_IMAGE_PREFIX} 变量。
# 请在 .env 文件中配置代理前缀，例如:
# DOCKER_IMAGE_PREFIX=docker.m.daocloud.io/
# =================================================================

# 定义内部网络
networks:
  ss_net:
    driver: bridge

# 定义持久化数据卷
volumes:
  pg_data:
  redis_data:
  rabbitmq_data:
  emqx_data:
  minio_data:

# 通用配置锚点 (复用配置，减少代码冗余)
x-common-opts: &common-opts
  restart: always
  networks:
    - ss_net
  # 日志轮转配置 (防止日志文件无限增长占满磁盘)
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  # =================================================================
  # 1. 接入层 Gateway (Nginx)
  # 作用: 统一 API 入口，反向代理 Java/Python 后端，解决 CORS
  # =================================================================
  gateway:
    <<: *common-opts
    image: ${DOCKER_IMAGE_PREFIX}nginx:alpine
    container_name: ss-gateway
    ports:
      - "${PORT_NGINX}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-core
      - backend-ai

  # =================================================================
  # 2. 核心后端 (Spring Boot 3)
  # =================================================================
  backend-core:
    <<: *common-opts
    container_name: ss-backend-core
    # 开发阶段使用 build，生产环境建议使用 image
    build:
      context: ./backend-java-core
      dockerfile: Dockerfile
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - TZ=${TZ}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER}
      - DB_PASS=${POSTGRES_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PASS=${REDIS_PASSWORD}
      - MQ_HOST=rabbitmq
      - MQ_USER=${RABBITMQ_USER}
      - MQ_PASS=${RABBITMQ_PASSWORD}
    # 智能等待：直到数据库和MQ完全启动成功才启动Java应用
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  # =================================================================
  # 3. AI 引擎 (Python FastAPI)
  # =================================================================
  backend-ai:
    <<: *common-opts
    container_name: ss-backend-ai
    build:
      context: ./backend-python-ai
      dockerfile: Dockerfile
    environment:
      - TZ=${TZ}
      - DB_HOST=postgres
      - MQ_HOST=rabbitmq
      - MQ_USER=${RABBITMQ_USER}
      - MQ_PASS=${RABBITMQ_PASSWORD}
    depends_on:
      rabbitmq:
        condition: service_healthy

  # =================================================================
  # 4. 基础设施 - 数据库 (PostgreSQL 15)
  # =================================================================
  postgres:
    <<: *common-opts
    image: ${DOCKER_IMAGE_PREFIX}postgres:15-alpine
    container_name: ss-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    # 健康检查：确保数据库端口可连接且能接受指令
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =================================================================
  # 5. 基础设施 - 缓存 (Redis 7)
  # =================================================================
  redis:
    <<: *common-opts
    image: ${DOCKER_IMAGE_PREFIX}redis:7-alpine
    container_name: ss-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # =================================================================
  # 6. 基础设施 - 消息队列 (RabbitMQ)
  # =================================================================
  rabbitmq:
    <<: *common-opts
    image: ${DOCKER_IMAGE_PREFIX}rabbitmq:3-management-alpine
    container_name: ss-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"   # 应用通信端口
      - "15672:15672" # 管理后台端口
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    # 健康检查：RabbitMQ 自带诊断工具
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5

  # =================================================================
  # 7. 基础设施 - IoT Broker (EMQX)
  # =================================================================
  emqx:
    <<: *common-opts
    image: ${DOCKER_IMAGE_PREFIX}emqx/emqx:5.3.0
    container_name: ss-emqx
    environment:
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${EMQX_USER}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_PASSWORD}
    ports:
      - "${PORT_EMQX_TCP}:1883"
      - "${PORT_EMQX_WS}:8083"
      - "${PORT_EMQX_DASHBOARD}:18083"
    volumes:
      - emqx_data:/opt/emqx/data

  # =================================================================
  # 8. 基础设施 - 对象存储 (MinIO)
  # =================================================================
  minio:
    <<: *common-opts
    image: ${DOCKER_IMAGE_PREFIX}minio/minio:latest
    container_name: ss-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${PORT_MINIO_API}:9000"
      - "${PORT_MINIO_CONSOLE}:9001"
    volumes:
      - minio_data:/data