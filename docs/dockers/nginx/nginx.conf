user root;
worker_processes 1;

events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile on;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Upload Limit
    client_max_body_size 50M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    upstream java_backend {
        server backend-core:8080; # 对应 docker-compose 中的服务名
    }

    server {
        listen 80;
        listen [::]:80;
        # 暂时接受所有 Host 访问，排除域名解析引起的误报
        server_name ss.kenz.site 192.168.1.21 localhost "";

        root /usr/share/nginx/html;
        index index.html index.htm;

        # 健康检查/连通性专用
        location /ping {
            return 200 "pong";
        }

        # 1. 管理后台 (SmallSteps UI - Admin)
        # 使用 ^~ 提高优先级，防止被下方的全局静态资源正则拦截导致 404
        location ^~ /webadminss/ {
            alias /usr/share/nginx/html/webadminss/;
            index index.html;
            try_files $uri $uri/ /webadminss/index.html;

            # 此处的静态资源处理仅针对 webadminss 子目录
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
                 expires 30d;
                 add_header Cache-Control "public, no-transform";
            }
        }

        # 2. 前端 App (SmallSteps App - Uni-app)
        loca2tion / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # 3. 全局静态资源缓存 (主要针对根目录 App)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # 4. 核心业务 API 转发
        location /prod-api/ {
            proxy_pass http://java_backend/ssapi/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        
    }
}