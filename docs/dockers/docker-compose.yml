# 项目名称 (在 .env 中定义 PROJECT_NAME=small-steps)
name: ${PROJECT_NAME}

# =================================================================
# 🇨🇳 中国大陆网络特别说明
# -----------------------------------------------------------------
# 为了解决 Docker Hub 拉取慢的问题，所有 image 指令都使用了 
# ${DOCKER_IMAGE_PREFIX} 变量。
# 请在 .env 文件中配置代理前缀，例如:
# DOCKER_IMAGE_PREFIX=docker.m.daocloud.io/
# =================================================================

# 定义内部网络
networks:
  ss_net:
    driver: bridge

# 定义持久化数据卷
volumes:
  pg_data:
  redis_data:
  rabbitmq_data:
  emqx_data:
  minio_data:
  n8n_data:

    # 通用配置锚点 (复用配置，减少代码冗余)
x-common-opts: &common-opts
  restart: always
  networks:
    - ss_net
  # 日志轮转配置 (防止日志文件无限增长占满磁盘)
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  # =================================================================
  # 1. 接入层 Gateway (Nginx)
  # 作用: 统一 API 入口，反向代理 Java/Python 后端，解决 CORS
  # =================================================================
  gateway:
    <<: *common-opts
    build:
      context: ../../projects/smallsteps-ui
      dockerfile: Dockerfile
      args:
        DOCKER_IMAGE_PREFIX: ${DOCKER_IMAGE_PREFIX}
      tags:
        - small-steps-ui:0.0.1
    container_name: ss-gateway
    ports:
      - "${PORT_NGINX}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../projects/smallsteps-app/dist/build/web:/usr/share/nginx/html:ro
      - ../../projects/smallsteps-ui/dist:/usr/share/nginx/html/webadminss:ro
    depends_on:
      - backend-core

  # =================================================================
  # 4. 基础设施 - 数据库 (PostgreSQL 15)
  # =================================================================
  postgres:
    <<: *common-opts
    image: ${DOCKER_IMAGE_PREFIX}postgres:15-alpine
    container_name: ss-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ}
    ports:
      - "15432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    # 健康检查：确保数据库端口可连接且能接受指令
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # =================================================================
  # 5. 基础设施 - 缓存 (Redis 7)
  # =================================================================
  redis:
    <<: *common-opts
    image: ${DOCKER_IMAGE_PREFIX}redis:7-alpine
    container_name: ss-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # =================================================================
  # 6. 基础设施 - 消息队列 (RabbitMQ)
  # =================================================================
  rabbitmq:
    <<: *common-opts
    image: ${DOCKER_IMAGE_PREFIX}rabbitmq:3-management-alpine
    container_name: ss-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "6672:5672" # 应用通信端口
      - "15672:15672" # 管理后台端口
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    # 健康检查：RabbitMQ 自带诊断工具
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 10s
      retries: 5

  # =================================================================
  # 7. 基础设施 - IoT Broker (EMQX)
  # =================================================================
  emqx:
    <<: *common-opts
    image: ${DOCKER_IMAGE_PREFIX}emqx:5.3.0
    container_name: ss-emqx
    environment:
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${EMQX_USER}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_PASSWORD}
    ports:
      - "127.0.0.1:${PORT_EMQX_TCP}:1883"
      - "127.0.0.1:${PORT_EMQX_WS}:8083"
      - "127.0.0.1:${PORT_EMQX_DASHBOARD}:18083"
    volumes:
      - emqx_data:/opt/emqx/data

  # =================================================================
  # 8. 基础设施 - 对象存储 (MinIO)
  # =================================================================
  minio:
    <<: *common-opts
    image: ${DOCKER_IMAGE_PREFIX}minio:latest
    container_name: ss-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${PORT_MINIO_API}:9000"
      - "127.0.0.1:${PORT_MINIO_CONSOLE}:9001"
    volumes:
      - minio_data:/data
  # =================================================================
  # 9. 业务流程编排 - n8n
  # =================================================================
  n8n:
    <<: *common-opts
    image: ${DOCKER_IMAGE_PREFIX}n8nio:latest
    container_name: ss-n8n
    ports:
      - "${PORT_N8N}:5678"
    environment:
      - GENERIC_TIMEZONE=${TZ}
      - TZ=${TZ}
      # 鉴权设置 (建议在 .env 中设置 N8N_BASIC_AUTH_ACTIVE=true)
      - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE:-true}
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - N8N_SECURE_COOKIE=false
      # 如果需要通过外网访问 Webhook，请修改此处
      - WEBHOOK_URL=http://localhost:${PORT_N8N}/
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - postgres

  # =================================================================
  # 10. 业务核心 - SmallSteps API
  # =================================================================
  backend-core:
    <<: *common-opts
    container_name: ss-api
    build:
      context: ../../projects/smallsteps-api
      dockerfile: smallsteps-admin/Dockerfile
      args:
        - USE_BUILD=${USE_BUILD:-false}
        - DOCKER_IMAGE_PREFIX=${DOCKER_IMAGE_PREFIX}
      tags:
        - small-steps-api:0.0.1
    environment:
      - TZ=${TZ}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASS=${POSTGRES_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASS=${REDIS_PASSWORD}
      # SnailJob Server Configuration
      - SNAIL_JOB_SERVER_HOST=smallsteps-snailjob-server
      - SNAIL_JOB_SERVER_PORT=17888
    ports:
      - "8081:8080"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./config:/app/config
