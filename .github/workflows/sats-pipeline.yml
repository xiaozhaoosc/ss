name: SATS-Automated-Testing-Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build and Run API Tests
        run: |
          cd smallsteps-api
          mvn test -Dgroups=dev
      - name: Generate Allure Report
        run: |
          cd smallsteps-api
          mvn allure:report
      - name: Upload Allure Results
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-api
          path: smallsteps-api/target/allure-results

  ui-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install dependencies
        run: |
          cd autotests/sats-ui
          npm install
      - name: Install Playwright Browsers
        run: |
          cd autotests/sats-ui
          npx playwright install --with-deps
      - name: Run Playwright tests
        run: |
          cd autotests/sats-ui
          npx playwright test
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-ui
          path: autotests/sats-ui/playwright-report/

  app-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install dependencies
        run: |
          cd autotests/sats-app
          npm install
      - name: Install Playwright Browsers
        run: |
          cd autotests/sats-app
          npx playwright install --with-deps
      - name: Run Playwright tests
        run: |
          cd autotests/sats-app
          npx playwright test
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-app
          path: autotests/sats-app/playwright-report/
