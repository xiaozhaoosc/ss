name: Small Steps E2E Tests

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: smallsteps
          POSTGRES_PASSWORD: ui123456789~
          POSTGRES_DB: smallsteps_db
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: |
            smallsteps-ui/package-lock.json
            smallsteps-app/package-lock.json

      - name: Init Database
        run: |
          # Try to find and execute any SQL files in the sql directory
          for f in sql/*.sql; do
            if [ -f "$f" ]; then
              PGPASSWORD=ui123456789~ psql -h localhost -U smallsteps -d smallsteps_db -f "$f"
            fi
          done
        continue-on-error: true

      - name: Build Backend
        run: mvn clean package -DskipTests -f smallsteps-api/pom.xml

      - name: Start Backend
        run: |
          java -jar smallsteps-api/smallsteps-admin/target/smallsteps-admin.jar --spring.profiles.active=dev --spring.datasource.url=jdbc:postgresql://localhost:5432/smallsteps_db --spring.datasource.username=smallsteps --spring.datasource.password=ui123456789~ --spring.data.redis.host=localhost --spring.data.redis.port=6379 --spring.data.redis.password=ui123456789~ &
        env:
          JAVA_OPTS: "-Xmx1024m"

      - name: Install dependencies
        run: |
          cd smallsteps-ui && npm ci
          cd ../smallsteps-app && npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
        working-directory: smallsteps-ui

      - name: Run Web E2E Tests
        run: |
          VITE_SKIP_TOUR=true npm run dev &
          npx wait-on http://localhost:88 --timeout 60000
          npm run test:e2e
        working-directory: smallsteps-ui
        env:
          CI: true

      - name: Run App E2E Tests
        run: |
          npm run dev:h5 -- --port 9090 &
          npx wait-on http://localhost:9090 --timeout 60000
          npm run test:e2e
        working-directory: smallsteps-app
        env:
          CI: true

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            smallsteps-ui/playwright-report/
            smallsteps-app/playwright-report/
          retention-days: 30
