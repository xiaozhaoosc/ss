user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        absolute_redirect off;

        # 1. 前端页面
        location /webadminss/ {
            index index.html;
            try_files $uri $uri/ /webadminss/index.html;
        }

        # 2. 根路径重定向
        location = / {
            return 301 /webadminss/;
        }

        # 3. 核心修复：后端 API 代理 (匹配前端 /prod-api 前缀)
        location /prod-api/ {
            # 转发到后端容器的 8080 端口，并映射到后端的 context-path: /ssapi/
            proxy_pass http://backend-core:8080/ssapi/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # 解决长连接问题（如果是 WebSocket 或 SSE）
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # 额外：处理可能带有 context-path 前缀的 API 请求
        location /webadminss/prod-api/ {
            proxy_pass http://backend-core:8080/ssapi/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
