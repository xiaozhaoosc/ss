<h2>ADHD 模板库展示风格</h2>
<p class="subtitle">在 App 端展示模板库，哪种布局最符合预期的用户体验？</p>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>卡片网格流 (Card Grid)</h3>
      <p>类似 Pinterest，以大图标和颜色区分，视觉冲击力强，适合探索发现。</p>
      <div style="margin-top: 10px; display: flex; gap: 8px;">
        <div style="width: 60px; height: 60px; background: #e0e7ff; border-radius: 8px;"></div>
        <div style="width: 60px; height: 60px; background: #fce7f3; border-radius: 8px;"></div>
        <div style="width: 60px; height: 60px; background: #dcfce7; border-radius: 8px;"></div>
      </div>
    </div>
  </div>
  
  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>标签列表 (List with Tags)</h3>
      <p>侧重文字、步骤预览和分类标签（如“晨间日常”、“深度工作”），适合快速查找和阅读。</p>
      <div style="margin-top: 10px; display: flex; flex-direction: column; gap: 4px;">
        <div style="width: 100%; height: 20px; background: #f3f4f6; border-radius: 4px;"></div>
        <div style="width: 100%; height: 20px; background: #f3f4f6; border-radius: 4px;"></div>
        <div style="width: 100%; height: 20px; background: #f3f4f6; border-radius: 4px;"></div>
      </div>
    </div>
  </div>

  <div class="option" data-choice="c" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>分类横滑推荐 (App Store Style)</h3>
      <p>按照场景横向滑动，适合移动端，首屏展示更多场景分类。</p>
      <div style="margin-top: 10px; padding: 8px; background: #f9fafb; border-radius: 8px;">
        <div style="font-size: 12px; margin-bottom: 4px;">🎯 专注推荐</div>
        <div style="display: flex; gap: 8px; overflow: hidden;">
          <div style="width: 50px; height: 40px; background: #d1fae5; border-radius: 4px; flex-shrink: 0;"></div>
          <div style="width: 50px; height: 40px; background: #d1fae5; border-radius: 4px; flex-shrink: 0;"></div>
          <div style="width: 50px; height: 40px; background: #d1fae5; border-radius: 4px; flex-shrink: 0;"></div>
        </div>
      </div>
    </div>
  </div>
</div>
