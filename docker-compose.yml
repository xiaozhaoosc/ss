# Small Steps Unified Deployment
name: small-steps

networks:
  ss_net:
    driver: bridge

services:
  # Database
  postgres:
    image: ${DOCKER_IMAGE_PREFIX}postgres:15-alpine
    container_name: ss-postgres
    restart: always
    networks:
      - ss_net
    environment:
      - TZ=Asia/Shanghai
      - POSTGRES_USER=${POSTGRES_USER:-smallsteps}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ui123456789~}
      - POSTGRES_DB=${POSTGRES_DB:-smallsteps_db}
    ports:
      - "15432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Cache
  redis:
    image: ${DOCKER_IMAGE_PREFIX}redis:7-alpine
    container_name: ss-redis
    restart: always
    networks:
      - ss_net
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD:-ui123456789~}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Backend API
  api:
    build:
      context: ./smallsteps-api
      dockerfile: smallsteps-admin/Dockerfile
    container_name: ss-api
    restart: always
    networks:
      - ss_net
    environment:
      - TZ=Asia/Shanghai
      - profiles.active=prod
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-smallsteps_db}
      - DB_USER=${POSTGRES_USER:-smallsteps}
      - DB_PASS=${POSTGRES_PASSWORD:-ui123456789~}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASS=${REDIS_PASSWORD:-ui123456789~}
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Web Admin UI
  web-ui:
    build:
      context: ./smallsteps-ui
      dockerfile: Dockerfile
    container_name: ss-ui
    restart: always
    networks:
      - ss_net
    ports:
      - "80:80"
    depends_on:
      - api
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Mobile App (Web Version)
  mobile-app:
    build:
      context: ./smallsteps-app
      dockerfile: Dockerfile
    container_name: ss-app
    restart: always
    networks:
      - ss_net
    ports:
      - "81:80"
    depends_on:
      - api
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pg_data:
  redis_data:
