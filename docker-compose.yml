# 统一部署配置文件
# 包含 smallsteps-api、smallsteps-ui、smallsteps-app 和 xiaozhi-esp32-server-java 项目

version: '3.8'

# 项目名称
name: small-steps

# 网络配置
networks:
  ss_net:
    driver: bridge

# 通用配置锚点
x-common-opts:
  &common-opts
  restart: always
  networks:
    - ss_net
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

# 数据卷配置
volumes:
  # smallsteps-api 数据卷
  pg_data:
  redis_data:
  # xiaozhi 数据卷
  mysql_data:
  maven_repo:
  vosk_models:

# 服务配置
services:
  # ==================== smallsteps-api 服务 ====================
  
  # PostgreSQL 数据库服务
  postgres:
    <<: *common-opts
    container_name: ss-postgres
    image: registry.cn-shanghai.aliyuncs.com/ken_projects/postgres:15-alpine
    environment:
      - TZ=Asia/Shanghai
      - POSTGRES_USER=smallsteps
      - POSTGRES_PASSWORD=ui123456789~
      - POSTGRES_DB=smallsteps_db
    ports:
      - "15432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  # Redis 缓存服务
  redis:
    <<: *common-opts
    container_name: ss-redis
    image: registry.cn-shanghai.aliyuncs.com/ken_projects/redis:7-alpine
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --requirepass ui123456789~

  # 后端核心服务
  backend-core:
    <<: *common-opts
    container_name: ss-api
    build:
      context: ./smallsteps-api
      dockerfile: smallsteps-admin/Dockerfile
      tags:
        - small-steps-backend-core:0.0.1
    environment:
      - TZ=Asia/Shanghai
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=smallsteps_db
      - DB_USER=smallsteps
      - DB_PASS=ui123456789~
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASS=ui123456789~
    ports:
      - "8081:8080"
    depends_on:
      - postgres
      - redis

