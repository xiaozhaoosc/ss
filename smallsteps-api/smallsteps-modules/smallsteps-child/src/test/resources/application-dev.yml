# No content needed if everything is in application.yml, 
# but let's put the DB info here to match the profile.
spring:
  datasource:
    dynamic:
      primary: master
      datasource:
        master:
          url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:15432}/${DB_NAME:smallsteps_db}
          username: ${DB_USER:smallsteps}
          password: ${DB_PASS:ui123456789~}
          driverClassName: org.postgresql.Driver
